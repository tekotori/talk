<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4f1">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Talk">

  <title>Talk</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================
       トーク一覧
  ========================== -->
  <main id="talkListScreen" class="screen talk-list-screen">

    <header class="list-header">
      <h1>Talk</h1>
    </header>

    <section class="talk-list">

      <button
        id="openKoheiChat"
        class="talk-item"
        type="button"
      >

        <div class="talk-avatar">
          🐶
        </div>

        <div class="talk-info">

          <div class="talk-item-top">
            <div class="talk-name">
              航平
            </div>

            <div
              id="koheiLastTime"
              class="talk-time"
            ></div>
          </div>

          <div
            id="koheiLastMessage"
            class="talk-preview"
          >
            メッセージ
          </div>

        </div>

      </button>

    </section>

  </main>


  <!-- =========================
       航平とのチャット
  ========================== -->
  <main
    id="chatScreen"
    class="app screen"
    hidden
  >

    <header class="topbar">

      <button
        id="backToTalkList"
        class="back-button"
        type="button"
        aria-label="トーク一覧へ戻る"
      >
        ‹
      </button>

      <div class="avatar">
        🐶
      </div>

      <div>
        <div class="name">
          航平
        </div>

        <div class="status">
          online
        </div>
      </div>

      <button
        id="notificationButton"
        type="button"
        class="notification-button"
      >
        通知をON
      </button>

    </header>


    <section
      id="messages"
      class="messages"
      aria-live="polite"
    ></section>


    <form
      id="chatForm"
      class="composer"
    >

      <textarea
        id="messageInput"
        rows="1"
        placeholder="メッセージ"
        aria-label="メッセージ"
      ></textarea>

      <button type="submit">
        送信
      </button>

    </form>

  </main>


  <script src="./app.js"></script>

</body>
